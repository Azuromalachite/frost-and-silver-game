  - id: claim.game.weather_presets
    statement: >
      In the game, the Hard weather (seed 313) leaves the default plan with about
      1,070 kcal a day after 1573 and about 90 hunger deaths, while a careful plan
      can save most of them; on the Extreme weather (seed 2024) no tested plan
      avoids mass hunger. The presets are sequences from the game's weather model,
      not records of real years.
    layer: game_result
    status: labelled
    sources: []
    pages:
      - path: frost-and-silver.html
        anchor: it is not a record of the real weather in those years
      - path: docs/hard-mode-2026-11-18.md
        anchor: Difficulty changes only the weather sequence.
    notes: >
      Screened 2026-11-18 on seeds 1-2000 with tools/seeds.html (default plan,
      best land first at each re-plan; 2,304 tested plans picked after the weather
      is known). The default-plan numbers are WX_PRESETS in the game and are
      re-measured by tests/review_model.cjs on every pull request. No source: the
      seeds are the model's own output. The colonial rules' food effect depends on
      the weather (about -490, -720 and -1,040 kcal on Standard, Hard and
      Extreme), so groups on different presets are not comparable.

  - id: claim.game.replan_dominance
    statement: >
      Which re-plan choice grows more food after crews fall depends on the plan
      the player held. With the starting plan (two chuño crews) keeping the same
      shares grew less colonial food than best land first on every one of seeds
      1-80; with a plan of 5/5/3/1 crews and none on chuño it grew more on 24 of
      80, because spreading crews over the lower zones grows more than crowding
      the valley. The re-plan box shows both choices for the player's own plan,
      on sample weathers.
    layer: game_result
    status: labelled
    sources: []
    pages:
      - path: frost-and-silver.html
        anchor: Which choice is better depends on the plan you held
      - path: docs/teaching-guide.md
        anchor: Which choice grows more depends on the plan the student held
    notes: >
      Asserted by tests/review_model.cjs (SHARES_WINS), whose self-test plants a
      "Keep the same shares" that silently does best land first. Until review 3
      (2026-11-18) the game told every student that keeping the shares "never does
      better", a result measured on the starting plan only. A review's Python copy
      of the model counted 22 seeds for the 5/5/3/1 plan; the game itself gives 24.

  - id: claim.game.changing_plan
    statement: >
      Building Valley and Upper-field terraces in harvest 1 with no chuño crews,
      three chuño crews in harvests 2 and 3, then every crew on the best land
      after 1573, beat the best fixed plan picked after the weather was known on
      52 of seeds 1-80. With Valley terraces alone, or other numbers of chuño
      crews, a changing plan rarely does.
    layer: game_result
    status: labelled
    sources: []
    pages:
      - path: frost-and-silver.html
        anchor: one plan that changes by harvest beat it on 52 of 80 test weathers
    notes: >
      Asserted by tests/review_model.cjs (CHANGING_WINS). The end screen used to
      say "about two seeds in three" without naming the terraces; a review found
      the obvious reading (Valley terraces only) beats it on 0-13 of 80. It was
      57 of 80 until terraces stopped counting toward the welfare index's
      resilience in the year they are built (2026-11-18).

  - id: claim.game.advance_plan
    statement: >
      Of the 2,304 tested plans, building Valley terraces, one chuño crew and best
      land first in the Inca years, then every crew on the best land first after
      1573, had the highest welfare averaged over seeds 1-80, and is the same plan
      when chosen on seeds 1-40 or 41-80 alone. Scored on each weather it averages
      73.9 welfare and 1,550 kcal after 1573, against 76.6 and 1,587 for the best
      plan picked knowing that weather; it reaches 1,700 kcal on 21 seeds.
    layer: game_result
    status: labelled
    sources: []
    pages:
      - path: frost-and-silver.html
        anchor: Of the 2,304 tested plans it had the best welfare averaged over 80 test weathers
    notes: >
      The end screen leads with it as a fair benchmark, a plan chosen before the
      weather is known, and shows the hindsight best below it. Measured
      2026-11-18 after the terrace fix (claim.game.welfare_index); the same plan
      won before it.

  - id: claim.game.stores_carried
    statement: >
      Each person's share of the community stores is carried across the 70 years
      from harvest 3 (c. 1502) to harvest 4 (c. 1575): the collapse halves people
      and food together. No store lasts 70 years; the game keeps the simplification
      and labels it.
    layer: game_assumption
    status: labelled
    sources: [morris1986]
    code: ["S.pop *= (1 - COLLAPSE);"]
    pages:
      - path: frost-and-silver.html
        anchor: keeps each person's share of the community stores across the gap
    notes: >
      Measured 2026-11-18 on the default plan, seeds 1-80: halving the stores at
      1573 gives colonial food 1,324 kcal and 49 deaths, emptying them 1,263 and
      56, against 1,385 and 41 as played; the lesson (GDP up, food down) holds on
      72 and 75 of 80 seeds against 68. Kept by the author's decision, because the
      lesson does not depend on it; Hard and Extreme are unaffected (their stores
      are empty by 1573). The source documents Inca storehouses, not their
      survival across the conquest.

