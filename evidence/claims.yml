      day after the colonial mita.
    layer: unsourced
    status: unsupported
    sources: [thitibordin_game]
    searched: >
      Maddison (2003); the literature review supplied on 2026-11-17; the 23-work
      reference collection's index notes; web searches by the review agents on
      2026-11-17. None gives these figures.
    pages:
      - path: frost-and-silver.html
        anchor: The course figure of 1,700 falling to 1,200 kcal a day has no primary source
      - path: docs/history-and-evidence.md
        anchor: Food per person fell from about 1,700 to about 1,200 kcal a day

  - id: claim.food.household_shortfall
    statement: >
      Households could go short of food even where the community or region
      produced a surplus.
    layer: documented
    status: partly_supported
    sources: [wernke_whitmore2009]
    pages:
      - path: docs/history-and-evidence.md
        anchor: Households can go short even when a region produces a surplus
      - path: frost-and-silver.html
        anchor: households can go short while a region has a surplus

  - id: claim.game.household_spread
    statement: >
      The game's share of households below 1,700 kcal assumes household food
