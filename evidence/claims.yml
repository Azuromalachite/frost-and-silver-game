        anchor: Potosí also ran on paid workers (mingas)
    notes: Selected direct readings support paid labour and women in processing and trade; the Gil Montero and Zagalsky source remains from notes. No historical wage-to-calorie coefficient follows.

  - id: claim.game.tribute_in_food
