  - id: claim.colonial.mita_one_in_seven
    statement: >
      Toledo's Potosí mita drew one adult man in seven each year from the provinces
      of a defined mita region, not from every community.
    layer: documented
    status: partly_supported
    sources: [dell2010, upenn_dia_mita]
    pages:
      - path: frost-and-silver.html
        anchor: one adult man in seven from the provinces of the mita region
      - path: docs/history-and-evidence.md
        anchor: The Potosí mita drew one adult man in seven

  - id: claim.colonial.fixed_quotas
    statement: >
      Colonial obligations were assessed from population counts, but tribute
      assessments and official mita allocations followed different paths of
      adjustment; the game holding both totals fixed is a simplification.
    layer: documented
    status: partly_supported
    sources: [upenn_dia_mita, zagalsky2014]
    pages:
      - path: frost-and-silver.html
        anchor: When people died, the quotas were not cut to match.
      - path: docs/history-and-evidence.md
        anchor: Mita and tribute quotas were set from census counts
    notes: >
      Quota-setting from the 1570s counts is supported by a reference work. How
      often recounts (revisitas) lowered them is not settled here: tribute could be
      reassessed (claim.research.tribute_reassessment), and whether mita quotas
      were reset in practice is partly addressed by claim.research.quota_tribute_paths
      and claim.research.quota_fulfilment; Cole (1985) remains a reading lead.
      The game keeps both fixed; that is a simplification, labelled in the game.
      The historical statement is narrowed here; the player-facing wording that
      groups both obligations together remains a documented follow-up in the
      food-access implementation review, not a reason to upgrade this claim.
      The PR #1 review removed the book-presentation transcript from this claim's
      sources, because it qualifies the claim rather than supporting it.

  - id: claim.colonial.paid_labour_and_women
