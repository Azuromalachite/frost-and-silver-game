      Valdez and Bettcher document semisubterranean cists and storage vessels at
      coastal Tambo Viejo, including maize and coca evidence; not all storage
      followed the large highland qollqa pattern.
    layer: documented
    status: supported
    sources: [valdez_bettcher2025]
    pages:
