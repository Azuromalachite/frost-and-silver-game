# Load-bearing claims in the game and its documents.
#
# Rules and vocabulary: CONTRIBUTING.md. Checked by evidence/check_evidence.py.
#
#   id          stable, never reused or renumbered
#   statement   the claim, as narrowly as it can be stated
#   layer       documented | estimate | interpretation        (about history)
#               | game_assumption | game_result               (about the model)
#               | unsourced                                    (circulating, no source found)
#   status      for history layers: supported | partly_supported | unverified | unsupported | open
#               for game layers:    labelled  (the game tells the player it is an assumption or a model result)
#               for unsourced:      unsupported
#               'supported' needs a source at full_text_read or figures_checked;
#               'partly_supported' needs at least abstract_read or reference_work.
#   sources     keys in sources.yml (a game_result may have none: it is the model's own output)
#   code        game_assumption only: the exact code that sets the number(s); must
#               appear in frost-and-silver.html, so changing a constant forces an update here
#   searched    unsourced only: what was searched without finding a source
#   pages       where the claim is stated, each with an anchor phrase that must appear
#               on that page (whitespace, case and HTML entities ignored)
#   notes       scope, caveats

version: 0.1

claims:
  # --- output (GDP) ---------------------------------------------------------
  - id: claim.gdp.maddison_1500_1600
    statement: >
      Maddison's GDP per person for Latin America as a whole is 416 in 1500 and
      438 in 1600, in 1990 international dollars.
    layer: estimate
    status: supported
    sources: [maddison2003]
    pages:
      - path: docs/history-and-evidence.md
        anchor: Maddison's figures for Latin America as a whole go from 416
      - path: frost-and-silver.html
        anchor: from 416 in 1500 to 438 in 1600
    notes: Conjectures for a whole continent, not Andes-specific measurements.

  - id: claim.gdp.total_fell_per_person_rose
    statement: >
      In Maddison's estimates, total output and population fell between 1500 and
      1600 while output per person rose.
    layer: estimate
    status: supported
    sources: [maddison2003]
    pages:
      - path: docs/history-and-evidence.md
        anchor: Total output and population fell while output per person rose
      - path: frost-and-silver.html
        anchor: even as total output and population fell

  - id: claim.gdp.units_not_mixed
    statement: >
      Newer Maddison Project benchmarks use different dollars from Maddison
      (2003) and should not be mixed with the 1990 figures.
    layer: documented
    status: unverified
    sources: [bolt_vanzanden2025]
    pages:
      - path: docs/history-and-evidence.md
        anchor: Newer Maddison Project figures use different dollars

  - id: claim.gdp.colonial_growth_mining
    statement: >
      Colonial Peru and Mexico saw economic growth from about 1550, driven partly
      by mining.
    layer: interpretation
    status: unverified
    sources: [arroyoabad_vanzanden2016]
    pages:
      - path: docs/history-and-evidence.md
        anchor: Colonial Peru and Mexico saw economic growth from about 1550

  - id: claim.gdp.silver_or_land
    statement: >
      How much of the rise in output per person came from silver and how much
      from more land per survivor after the population collapse is open.
    layer: interpretation
    status: open
    sources: [arroyoabad_etal2012, arroyoabad_vanzanden2016]
    pages:
      - path: docs/history-and-evidence.md
        anchor: How much of the rise in GDP per person was silver

  - id: claim.game.gdp_rise_from_land
    statement: >
      In the game, GDP per person rises over time through silver and through the
      population collapse, and which is the main cause depends on the
      decomposition: without silver it barely rises, without the collapse it
      still rises. The collapse works mostly through the player's re-plan: "Best
      land first" leaves survivors farming their best land; more land per survivor
      adds about a quarter of that.
    layer: game_result
    status: labelled
    sources: [maddison2003]
    pages:
      - path: frost-and-silver.html
        anchor: In your game the change splits into two parts.
      - path: docs/history-and-evidence.md
        anchor: In the game, GDP per person rises through silver and through the population collapse
    notes: >
      Measured 2026-11-18 (docs/sensitivity-2026-11-18.md), default plan, seeds
      1-80: of about 6.5 index points not caused by the rules, about 3.0 come
      from chuño crews moved to the fields, 2.0 from retreating to the best
      zones, 1.5 from the land exponent (0 at exponent 1). The first two follow
      from the re-plan choice (before 18 Nov 2026, a silent trim). Until
      2026-11-18 this claim said "more land per survivor", which the sweep
      showed to be about a quarter of the effect. A combined review of 1edc416
      showed the remaining single-cause wording was decomposition-dependent:
      without silver the rise is +0.19 points, without the pre-1573 collapse
      +5.14 (reproduced 2026-11-18); after the re-plan choice, with best land
      first, +0.07 and +5.47. With the same shares the rules account for 3.05 of a
      4.65-point rise. Depends on claim.game.gdp_formula,
      claim.game.reduccion_sizes and claim.game.crew_trim_order.

  - id: claim.game.sampled_years
    statement: >
      Harvests 4-6 are snapshots of c. 1575, 1592 and 1600, not consecutive years.
      Stores, buildings and people carry over between them as a teaching
      simplification; the decades in between are not modelled.
    layer: game_assumption
    status: labelled
    sources: [thitibordin_game]
    code: ["const YEARS = ['c. 1500','c. 1501','c. 1502','c. 1575','c. 1592','c. 1600'];"]
    pages:
      - path: frost-and-silver.html
        anchor: Stores carry over between them as a teaching simplification
    notes: >
      Raised by a classroom-readiness review (18 Nov 2026): students may read the
      carried stores as a reconstruction of real reserves across decades. Two
      remedies exist, treating each snapshot as its own scenario or modelling the
      years between; the game labels the simplification instead.

  - id: claim.game.crew_trim_order
    statement: >
      When crews fall (1573, after the 1585-91 epidemics, and after hunger deaths) the game asks the
      player to re-plan: keep the plan's shares on fewer crews, put every crew on
      the best land first, or set them by hand; harvest and play wait for the
      choice. The choice decides much of the GDP rise and colonial food; which
      choice grows more depends on the plan held (claim.game.replan_dominance).
    layer: game_assumption
    status: labelled
    sources: [maddison2003]
    code: ["if (usedBefore > B) { S.replan = {from: before, B, was: usedBefore, kind: null};"]
    pages:
      - path: frost-and-silver.html
        anchor: The choice is yours, and it decides much of the result
    notes: >
      Measured 2026-11-18, default plan, seeds 1-80. Best land first: colonial
      food 1,385 kcal, welfare 70 -> 49, 41 deaths, the GDP effect reads 75 stay /
      5 rise (shown, not graded). Same shares: colonial food 1,004 kcal, welfare
      70 -> 35, 95 deaths, reads 40 stay / 40 rise. The mean food under each
      choice is asserted by tests/review_model.cjs (MEAN_FOOD_1_80). Before 18 Nov 2026 the board re-planned silently (wage,
      then chuño, then the highest fields), which a sensitivity sweep found drove
      much of the GDP rise; making it the player's choice was the fix. The pinned
      run and the model check choose best land first. No source sets either
      plan; the source listed is the GDP estimate the game is tuned to.

  - id: claim.game.grading_weather
    statement: >
      Predictions compare the colonial years with Inca rules for the same people
      and weather. Only the food prediction is graded. The colonial rules' GDP
      effect is shown, not graded, because the weather nudges it (silver ignores
      the weather while the farm output the mita removes does not: with the
      default plan and best land first, seeds 1-80 give "rise" in 5 runs and
      "stay" in 75) and the student's re-plan moves it (the two re-plan choices
      give different answers on 35 of 80 seeds).
    layer: game_result
    status: labelled
    sources: [maddison2003]
    pages:
      - path: frost-and-silver.html
        anchor: That is one reason the GDP answer is not graded
    notes: >
      Measured 2026-11-18 at commit cea920d (default plan, Next step, seeds 1-80);
      the same 74/6 split was reported in PR #1. The earlier text said a bad
      frost could not make a correct prediction look wrong, which was false.
      Re-measured after the chuño winter roll was added: still 74 "stay", 6 "rise"
      (same seeds). Re-measured after the re-plan choice (18 Nov 2026), choosing best
      land first: 75 "stay", 5 "rise" (seeds 10, 26, 30, 68, 72). A second combined review
      (main at 902bdbf) showed the grade also depends on the re-plan: keeping the same
      shares gives 40/40, and the two differ on 35 of 80 seeds (reproduced here), so
      the GDP prediction stopped being graded. Re-measure after any model change.

  - id: claim.game.gdp_formula
    statement: >
      GDP per person in the game is 340 + 0.045 × field output + silver, with each
      mita or wage crew adding silver.
    layer: game_assumption
    status: labelled
    sources: [maddison2003]
    code: ["SILVER_BY_HARVEST = {4: 6, 5: 16, 6: 20}", "G0 = 340, P = 0.045"]
    pages:
      - path: frost-and-silver.html
        anchor: Teaching assumptions, tuned so the Inca years start near Maddison's 416

  - id: claim.game.gdp_index
    statement: >
      The game shows GDP per person as an index (c. 1500 = 100) so that series in
      different dollars (Maddison 2003 in 1990 dollars; the Maddison Project
      Database in 2011 dollars) are never mixed.
    layer: game_assumption
    status: labelled
    sources: [maddison2003, bolt_vanzanden2025]
    code: ["const gi = v => v / 416 * 100;"]
    pages:
      - path: frost-and-silver.html
        anchor: An index lets the game compare with either without mixing units.

  - id: claim.colonial.silver_surge_1570s
    statement: >
      Silver output at Potosí rose sharply late in the sixteenth century, after
      mercury amalgamation spread in the 1570s.
    layer: documented
    status: unverified
    sources: [bakewell1984]
    pages:
      - path: frost-and-silver.html
        anchor: after mercury amalgamation spread in the 1570s
      - path: docs/history-and-evidence.md
        anchor: Silver output at Potosí rose sharply after the 1570s

  - id: claim.game.silver_path
    statement: >
      Each mine worker's silver is worth more in later colonial harvests (6, 16 and
      20 per crew-equivalent per 1,000 people at harvests 4, 5 and 6).
    layer: game_assumption
    status: labelled
    sources: [bakewell1984]
    code: ["SILVER_BY_HARVEST = {4: 6, 5: 16, 6: 20}"]
    pages:
      - path: frost-and-silver.html
        anchor: The game raises the value of each mine worker's silver from harvest 4 to harvest 6

  - id: claim.game.welfare_index
    statement: >
      The Caloric Welfare Index scores each harvest out of 100: 50 for food
      adequacy, 30 for stores, 20 for farming resilience.
    layer: game_assumption
    status: labelled
    sources: [thitibordin_game]
    code: ["res: 20 * Math.min(1, 0.7 * protShare + 0.3 * spread)"]
    pages:
      - path: frost-and-silver.html
        anchor: It is a model output, not a measurement.
    notes: >
      The 50/30/20 weights come from the original game; the scoring of each part
      is this adaptation's. Resilience counts crews on terraces and raised fields
      that stood before the harvest; until 2026-11-18 it also counted those
      finished that year (frost losses never did). Fixing it left the default
      plan unchanged and lowered building plans' welfare by about 1 point.

  - id: claim.game.key_message
    statement: >
      In the game, GDP per person rises from the Inca harvests to the colonial
      harvests while food per person falls: growth without a better life.
    layer: game_result
    status: labelled
    sources: [maddison2003, thitibordin_game]
    pages:
      - path: frost-and-silver.html
        anchor: GDP grew. Did life get better?
      - path: docs/history-and-evidence.md
        anchor: GDP per person grew in sixteenth-century Latin America, but life did not
    notes: >
      The original author's message. The GDP half rests on claim.gdp.maddison_1500_1600;
      the food half on claim.food.kcal_1700_to_1200, which is unsourced.

  - id: claim.colonial.silver_to_spain_china
    statement: Potosí silver went to Spain and, through trade, as far as China.
    layer: documented
    status: unverified
    sources: [flynn2015]
    pages:
      - path: frost-and-silver.html
        anchor: GDP counts silver sent to Spain and China as output too
      - path: docs/history-and-evidence.md
        anchor: Potosí silver went to Spain and, through trade, as far as China

  # --- records ------------------------------------------------------------------
  - id: claim.quipu.decimal_knots
    statement: >
      Quipus recorded numbers in base ten: clusters of single knots for tens,
      hundreds and thousands, a long knot for the units, a figure-eight knot for
      one, and an empty place for zero.
    layer: documented
    status: unverified
    sources: [ascher1981, urton2003]
    pages:
      - path: frost-and-silver.html
        anchor: a figure-eight knot for 1
      - path: docs/history-and-evidence.md
        anchor: Quipus recorded numbers in base ten on pendant cords

  - id: claim.quipu.colonial_counts
    statement: >
      Early Spanish officials relied on quipu accounts for tribute and census
      counts.
    layer: documented
    status: unverified
    sources: [urton2003]
    pages:
      - path: frost-and-silver.html
        anchor: early Spanish officials relied on them for tribute and census counts
      - path: docs/history-and-evidence.md
        anchor: Early Spanish officials relied on quipu accounts

  - id: claim.game.quipu_report
    statement: >
      Each harvest report is drawn as the community's quipu, recording food grown,
      feasts or tribute, food available, people and days of stores.
    layer: game_assumption
    status: labelled
    sources: [ascher1981]
    code: ["function quipuSVG(cords)"]
    pages:
      - path: frost-and-silver.html
        anchor: This harvest's numbers knotted as a quipu, an illustration
    notes: Which figures a cord keeper recorded is not known; GDP is left off on purpose.

